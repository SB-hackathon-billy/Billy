name: seongbuk-sharing
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sb
      POSTGRES_USER: sb
      POSTGRES_PASSWORD: sb
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - sb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sb -d sb']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  api:
    image: seongbuk-sharing-runtime:local
    build:
      context: .
      dockerfile: infra/runtime.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${SB_DATABASE_URL:-postgres://sb:sb@db:5432/sb}
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGINS: ${SB_APP_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
      AI_MODE: ${SB_AI_MODE:-${AI_MODE:-live}}
      APP_MODE: ${SB_APP_MODE:-${APP_MODE:-demo}}
      COOKIE_NAME: __Host-demo_session
      COOKIE_SECURE: 'true'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/places').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    image: seongbuk-sharing-runtime:local
    command: ['npm', 'run', '-w', '@sb/worker', 'start']
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${SB_DATABASE_URL:-postgres://sb:sb@db:5432/sb}
      AI_MODE: ${SB_AI_MODE:-${AI_MODE:-live}}
      APP_MODE: ${SB_APP_MODE:-${APP_MODE:-demo}}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - '8443:8443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/certs/local.pem:/certs/local.pem:ro
      - ./infra/certs/local-key.pem:/certs/local-key.pem:ro
      - ./apps/web/dist:/srv:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  sb-postgres:
